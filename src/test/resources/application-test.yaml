spring:
  datasource:
    generate-unique-name: true
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create

  sql:
    init:
      mode: always

jwt:
  secret: test-secret-key-that-is-at-least-32-bytes-long
  expiration: 3600000
